# Run on the server after: docker pull anilpokhariya/plywise:latest
# Put SMTP + AUTH_SECRET in a sibling `.env` (not committed).

services:
  plywise:
    image: anilpokhariya/plywise:latest
    ports:
      - "3000:3000"
    environment:
      APP_NAME: ChessLab
      APP_URL: https://plywise.erevolutionsindia.com
      AUTH_SECRET: ${AUTH_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ChessLab}
      OTP_MINUTES: ${OTP_MINUTES:-10}
    volumes:
      - plywise-data:/app/data
    restart: unless-stopped

volumes:
  plywise-data:
